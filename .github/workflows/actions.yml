name: Run web scrapper

on:
  workflow_dispatch: # Cho phép kích hoạt thủ công từ giao diện GitHub Actions
  
jobs:
  run-scrapper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
# pip install pipreqs: keep exact versions of dependencies in requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run web scrapper script
        run: |
          python "[TopCV] Web scrapper.py"
      
      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update topcv.md"

      - name: Send Email
        if : steps.auto-commit-action.outputs.committed == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "TopCV Web Scrapper Update"
          to: phuongtrangnguyenha.work@gmail.com
          from: TOPCV Web Scrapper
          convert_markdown: true
          
