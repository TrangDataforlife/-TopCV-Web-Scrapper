name: TopCV Job Scraper

# Cấu hình thời gian chạy
on:
  schedule:
    # Chạy tự động lúc 00:00 UTC (tức 07:00 sáng giờ Việt Nam) mỗi ngày
    - cron: '0 0 * * *'
  # Cho phép bấm chạy thủ công từ giao diện GitHub
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
    # 1. Kéo code từ repo về máy ảo của GitHub
    - name: Check out repository
      uses: actions/checkout@v4

    # 2. Cài đặt môi trường Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. Cài đặt các thư viện từ file requirements.TXT
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.TXT
        playwright install chromium --with-deps
        
    # 4. Chạy script cào dữ liệu
    - name: Run Scraper
      run: python "Web scrapper.py"

    # 5. Commit và Push kết quả file CSV (topcv_jobs_pandas.csv) ngược lại Repository
    - name: Commit and push updated data
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add topcv_jobs_pandas.csv
        git commit -m "Auto-update job listings [skip ci]" || exit 0
        git push
